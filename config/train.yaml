# Training configuration for SAC agent on Unity environment
seed: 0
device: "cuda:1"

log_save_tb: false
log_frequency: 10000

# Environment
env: "unity_env"
executable_path: 
decision_interval: 1
render: true

# Motor control
use_motor: true
latent_action_dim: 8
mapping_path: "action_mapping.txt"
dt: 0.02

# Save agent
Save_Agent: true
save_frequency: 100000
checkpoint_path: 

# Replay buffer & training schedule
replay_buffer_capacity: 1000000
num_train_steps: 1000000
num_seed_steps: 50000
eval_frequency: 100000
num_eval_episodes: 10

# Agent specific parameters
agent:
  name: "sac"  
  # obs_dim / action_dim / action_range will be automatically set
  discount: 0.99
  init_temperature: 0.1

  alpha_lr: 1e-4
  alpha_betas: [0.9, 0.999]

  actor_lr: 1e-4
  actor_betas: [0.9, 0.999]
  actor_update_frequency: 1

  critic_lr: 1e-4
  critic_betas: [0.9, 0.999]
  critic_tau: 0.005
  critic_target_update_frequency: 2

  batch_size: 2048
  learnable_temperature: true

  critic_cfg:
    hidden_dim: 1024
    hidden_depth: 2

  actor_cfg:
    hidden_dim: 1024
    hidden_depth: 2
    log_std_bounds: [-5, 2]
